resolver 127.0.0.11 ipv6=off valid=10s;

upstream bitrix_backends {
    server backend:8080 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name bitrix.172.16.11.34.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bitrix.172.16.11.34.nip.io;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    client_max_body_size 100m;
    gzip on;
    gzip_min_length 1;
    gzip_types application/javascript text/javascript application/x-javascript;

    # Демонстрационный редирект внутри HTTPS-виртуального хоста.
    location = /redirect-me {
        return 302 /;
    }

    # Статику отдает внешний Nginx; .js сжимается при Accept-Encoding: gzip.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    # Все динамические URI, включая Bitrix URL rewrite, идут на балансировщик.
    location / {
        proxy_pass http://bitrix_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass jhguj;
    }
}
