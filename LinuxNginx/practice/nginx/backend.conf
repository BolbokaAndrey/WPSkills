resolver 127.0.0.11 ipv6=off valid=10s;

upstream php_fpm {
    zone php_fpm 64k;
    least_conn;
    server fpm:9000 resolve;
}

log_format backend '$time_iso8601 backend=$hostname request="$request" status=$status';
access_log /dev/stdout backend;
error_log /dev/stderr warn;

server {
    listen 8080;
    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_BACKEND $hostname;
        fastcgi_pass php_fpm;
    }
}
