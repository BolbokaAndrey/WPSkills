services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-skill
    environment:
      POSTGRES_DB: postgres_skill
      POSTGRES_USER: skill_user
      POSTGRES_PASSWORD: skill_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skill_user -d postgres_skill"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
