services:
  frankenphp:
    image: dunglas/frankenphp:latest
    volumes:
      - ./practice/app:/app:ro
      - ./practice/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro

  nginx:
    image: nginx:alpine
    depends_on:
      - php-fpm
    volumes:
      - ./practice/app/public:/var/www/public:ro
      - ./practice/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  php-fpm:
    image: php:8.4-fpm-alpine
    volumes:
      - ./practice/app/public:/var/www/public:ro
      - ./practice/app/src:/var/www/src:ro

  benchmark-client:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["while :; do sleep 3600; done"]
